# nginx load balancer that fans requests across all scaled `api` replicas.
# Using a variable in proxy_pass + Docker's embedded DNS forces nginx to
# re-resolve `api` on each request, so it round-robins across every replica
# created by `docker compose up --scale api=N`.
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=5s ipv6=off;   # Docker embedded DNS

    server {
        listen 8080;
        client_max_body_size 25m;            # allow large image / bulk uploads

        location / {
            set $backend "http://api:8000";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 300;
            proxy_read_timeout 300;
        }
    }
}

# docker-compose.yml
# Used for the "different numbers of Docker containers" part of the flood test.
#
#   Scale to N replicas behind an nginx load-balancer, then run Locust against
#   http://localhost:8080 and record latency / RPS for each N.
#
#   1 container :  docker compose up --scale api=1 -d
#   2 containers:  docker compose up --scale api=2 -d
#   3 containers:  docker compose up --scale api=3 -d
#
services:
  api:
    build: .
    expose:
      - "8000"
    environment:
      - PORT=8000
    volumes:
      - ./models:/app/models      # persist the trained model across restarts
      - ./data:/app/data          # persist uploaded/retraining data

  lb:
    image: nginx:alpine
    depends_on:
      - api
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
